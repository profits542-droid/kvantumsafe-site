<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Квантум Сейф — Постквантовая криптографическая безопасность</title>
<meta name="description" content="Криптографический комплаенс КНР (CIPS) и постквантовая безопасность NIST для банков и финансовых организаций Кыргызской Республики.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f19;
  --bg-raised:#101526;
  --bg-card:#131a2b;
  --line:#232b42;
  --cyan:#00f2fe;
  --blue:#4facfe;
  --text:#f2f5fa;
  --muted:#8b95ac;
  --muted-2:#5d6784;
  --danger:#ff6b6b;
  --radius-lg:18px;
  --radius-sm:10px;
  --maxw:1180px;
  --font-display:'Space Grotesk', 'Inter', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
img,svg{display:block;max-width:100%;}
a{color:inherit;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;font-weight:600;letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:inherit;}

/* focus visibility */
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:3px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;scroll-behavior:auto !important;}
}

/* ---------- Header ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(11,15,25,0.86);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.header-inner{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 22px;
  gap:14px;
}
.logo{
  font-family:var(--font-display);
  font-weight:700;
  font-size:1.05rem;
  letter-spacing:0.01em;
  white-space:nowrap;
}
.logo em{
  font-style:normal;
  color:var(--cyan);
}
.header-right{display:flex;align-items:center;gap:14px;}
.htp-badge{
  font-size:0.68rem;
  color:var(--muted);
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 12px;
  white-space:nowrap;
  display:none;
}
.lang-switch{
  display:flex;
  border:1px solid var(--line);
  border-radius:999px;
  overflow:hidden;
}
.lang-switch button{
  background:transparent;
  border:none;
  color:var(--muted);
  font-size:0.78rem;
  font-weight:600;
  padding:7px 14px;
  cursor:pointer;
  transition:color .2s ease, background .2s ease;
}
.lang-switch button.active{
  background:var(--cyan);
  color:#04121a;
}

@media(min-width:720px){
  .htp-badge{display:inline-block;}
}

/* ---------- Hero ---------- */
.hero{
  position:relative;
  padding:64px 0 60px;
  overflow:hidden;
  background:
    radial-gradient(680px 420px at 82% -10%, rgba(0,242,254,0.14), transparent 60%),
    radial-gradient(520px 360px at -10% 40%, rgba(79,172,254,0.10), transparent 60%);
}
.hero-grid-lines{
  position:absolute;inset:0;
  opacity:0.35;
  pointer-events:none;
}
.hero-inner{position:relative;z-index:1;}
.hero-kicker{
  font-family:var(--font-mono);
  font-size:0.78rem;
  color:var(--cyan);
  margin-bottom:18px;
}
.hero h1{
  font-size:clamp(1.9rem, 5vw, 3.1rem);
  line-height:1.12;
  max-width:14ch;
  margin-bottom:22px;
}
.hero-sub{
  color:var(--muted);
  font-size:1.02rem;
  max-width:52ch;
  margin-bottom:30px;
}
.btn-primary{
  display:inline-flex;
  align-items:center;
  gap:10px;
  background:linear-gradient(120deg, var(--blue), var(--cyan));
  color:#04121a;
  font-weight:700;
  font-size:0.95rem;
  padding:15px 26px;
  border:none;
  border-radius:var(--radius-sm);
  cursor:pointer;
  box-shadow:0 14px 34px -12px rgba(0,242,254,0.45);
  transition:transform .18s ease, box-shadow .18s ease;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 18px 40px -12px rgba(0,242,254,0.6);}
.hero-footnote{
  margin-top:16px;
  font-size:0.78rem;
  color:var(--muted-2);
  max-width:46ch;
}

/* ---------- Section shell ---------- */
section{padding:64px 0;}
.section-head{
  max-width:60ch;
  margin-bottom:36px;
}
.eyebrow{
  font-family:var(--font-mono);
  font-size:0.74rem;
  color:var(--muted-2);
  margin-bottom:10px;
}
.section-head h2{
  font-size:clamp(1.5rem, 3.4vw, 2.1rem);
  margin-bottom:12px;
}
.section-head p{color:var(--muted);}

/* ---------- Product cards ---------- */
.product-grid{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
}
.product-card{
  flex:1 1 320px;
  background:var(--bg-card);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:28px 26px 30px;
  display:flex;
  flex-direction:column;
}
.product-card.featured{
  border-color:rgba(0,242,254,0.35);
  background:linear-gradient(180deg, rgba(0,242,254,0.05), var(--bg-card) 40%);
}
.product-number{
  font-family:var(--font-mono);
  font-size:0.72rem;
  color:var(--cyan);
  margin-bottom:14px;
}
.product-card h3{font-size:1.22rem;margin-bottom:10px;}
.product-desc{color:var(--muted);font-size:0.92rem;margin-bottom:18px;flex-grow:1;}
.product-price{
  font-family:var(--font-mono);
  font-size:0.86rem;
  color:var(--text);
  border-top:1px solid var(--line);
  padding-top:16px;
  margin-top:auto;
}
.product-price span{display:block;color:var(--muted-2);font-size:0.72rem;margin-bottom:4px;}

/* scan form inside product card 1 */
.scan-form{margin-top:6px;}
.scan-row{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}
.scan-row input{
  flex:1;
  background:var(--bg);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:var(--radius-sm);
  padding:12px 14px;
  font-family:var(--font-mono);
  font-size:0.86rem;
}
.scan-row input:focus{border-color:var(--cyan);}
.scan-row button{
  background:var(--cyan);
  color:#04121a;
  border:none;
  border-radius:var(--radius-sm);
  padding:0 18px;
  font-weight:700;
  font-size:0.85rem;
  cursor:pointer;
  white-space:nowrap;
}
.scan-row button:disabled{opacity:0.55;cursor:progress;}
.scan-status{
  font-family:var(--font-mono);
  font-size:0.78rem;
  min-height:1.2em;
}
.scan-status.error{color:var(--danger);}
.scan-status.busy{color:var(--blue);}
.scan-status.success{color:var(--cyan);}

/* ---------- Tariff table ---------- */
.tariff-table{
  width:100%;
  border-collapse:collapse;
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  overflow:hidden;
}
.tariff-table thead th{
  text-align:left;
  font-family:var(--font-mono);
  font-weight:500;
  font-size:0.72rem;
  color:var(--muted-2);
  background:var(--bg-raised);
  padding:14px 16px;
  border-bottom:1px solid var(--line);
}
.tariff-table tbody td{
  padding:16px;
  border-bottom:1px solid var(--line);
  font-size:0.9rem;
  vertical-align:top;
}
.tariff-table tbody tr:last-child td{border-bottom:none;}
.tariff-name{font-weight:600;}
.tariff-desc{color:var(--muted);font-size:0.86rem;margin-top:4px;}
.tariff-price{
  font-family:var(--font-mono);
  color:var(--cyan);
  white-space:nowrap;
}
.tariff-price small{display:block;color:var(--muted-2);font-size:0.72rem;margin-top:3px;}

.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}

/* ---------- Industries ---------- */
.industry-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}
@media(min-width:640px){.industry-grid{grid-template-columns:1fr 1fr;}}
@media(min-width:980px){.industry-grid{grid-template-columns:repeat(3,1fr);}}
.industry-card{
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:20px 20px 22px;
  background:var(--bg-raised);
}
.industry-card h4{font-size:1.02rem;margin-bottom:8px;}
.industry-card p{color:var(--muted);font-size:0.86rem;}

/* ---------- Vision ---------- */
.vision-block{
  display:flex;
  flex-wrap:wrap;
  gap:28px;
}
.vision-col{flex:1 1 300px;}
.vision-col h4{font-size:1rem;margin-bottom:10px;color:var(--cyan);}
.vision-col p{color:var(--muted);font-size:0.92rem;}
.vendor-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:14px;
}
.vendor-chip{
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 14px;
  font-size:0.78rem;
  color:var(--muted);
  font-family:var(--font-mono);
}

/* ---------- Form ---------- */
.audit-section{
  background:var(--bg-raised);
  border-top:1px solid var(--line);
}
.form-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
  max-width:640px;
}
@media(min-width:640px){
  .form-grid{grid-template-columns:1fr 1fr;}
  .form-grid .full{grid-column:1 / -1;}
}
.field label{
  display:block;
  font-size:0.76rem;
  color:var(--muted);
  margin-bottom:6px;
}
.field input,.field textarea{
  width:100%;
  background:var(--bg);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:var(--radius-sm);
  padding:12px 14px;
  font-size:0.9rem;
  font-family:inherit;
}
.field textarea{resize:vertical;min-height:96px;}
.field input:focus,.field textarea:focus{border-color:var(--cyan);}
.form-submit{
  margin-top:8px;
  grid-column:1 / -1;
}
.form-note{
  font-size:0.76rem;
  color:var(--muted-2);
  margin-top:14px;
  max-width:56ch;
}
.form-status{
  margin-top:14px;
  font-size:0.86rem;
  min-height:1.2em;
}
.form-status.error{color:var(--danger);}
.form-status.success{color:var(--cyan);}
.field-hint{
  display:block;
  font-size:0.7rem;
  color:var(--muted-2);
  margin-top:5px;
}
.form-success{
  max-width:640px;
  margin-top:22px;
  padding:26px 24px;
  border:1px solid rgba(0,242,254,0.35);
  background:linear-gradient(180deg, rgba(0,242,254,0.08), transparent);
  border-radius:var(--radius-lg);
}
.form-success-icon{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:var(--cyan);
  color:#04121a;
  font-weight:700;
  margin-bottom:14px;
}
.form-success p{color:var(--text);font-size:0.94rem;}

/* ---------- Footer ---------- */
footer{
  border-top:1px solid var(--line);
  padding:34px 0;
}
.footer-inner{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  gap:12px;
  color:var(--muted-2);
  font-size:0.8rem;
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo" data-i18n-html="logo"></div>
    <div class="header-right">
      <span class="htp-badge" data-i18n="htpBadge"></span>
      <div class="lang-switch" role="group" aria-label="Language / Язык">
        <button type="button" id="lang-ru" onclick="setLang('ru')">RU</button>
        <button type="button" id="lang-en" onclick="setLang('en')">EN</button>
      </div>
    </div>
  </div>
</header>

<section class="hero">
  <svg class="hero-grid-lines" viewBox="0 0 1200 500" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#4facfe" stop-opacity="0"/>
        <stop offset="50%" stop-color="#4facfe" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M0,120 C300,60 500,220 800,140 C950,100 1050,180 1200,130" stroke="url(#lineFade)" stroke-width="1" fill="none"/>
    <path d="M0,300 C260,340 520,220 780,300 C980,360 1080,260 1200,300" stroke="url(#lineFade)" stroke-width="1" fill="none"/>
  </svg>
  <div class="wrap hero-inner">
    <div class="hero-kicker" data-i18n="heroKicker"></div>
    <h1 data-i18n="heroTitle"></h1>
    <p class="hero-sub" data-i18n="heroSub"></p>
    <button type="button" class="btn-primary" id="hero-cta" onclick="scrollToScan()">
      <span data-i18n="heroCta"></span>
    </button>
    <p class="hero-footnote" data-i18n="heroFootnote"></p>
  </div>
</section>

<section id="services">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow" data-i18n="servicesEyebrow"></div>
      <h2 data-i18n="servicesTitle"></h2>
      <p data-i18n="servicesSub"></p>
    </div>

    <div class="product-grid">

      <article class="product-card featured" id="product-1">
        <div class="product-number">01</div>
        <h3 data-i18n="p1Title"></h3>
        <p class="product-desc" data-i18n="p1Desc"></p>

        <form class="scan-form" id="scan-form" novalidate>
          <div class="scan-row">
            <input type="text" id="domain-input" inputmode="url" autocomplete="off" data-i18n-placeholder="p1Placeholder">
            <button type="submit" id="scan-submit" data-i18n="p1Button"></button>
          </div>
          <div class="scan-status" id="scan-status" role="status" aria-live="polite"></div>
        </form>

        <div class="product-price">
          <span data-i18n="p1PriceLabel"></span>
          <span data-i18n="p1Price"></span>
        </div>
      </article>

      <article class="product-card">
        <div class="product-number">02</div>
        <h3 data-i18n="p2Title"></h3>
        <p class="product-desc" data-i18n="p2Desc"></p>
        <div class="product-price">
          <span data-i18n="p2PriceLabel"></span>
          <span data-i18n="p2Price"></span>
        </div>
      </article>

      <article class="product-card">
        <div class="product-number">03</div>
        <h3 data-i18n="p3Title"></h3>
        <p class="product-desc" data-i18n="p3Desc"></p>
        <div class="product-price">
          <span data-i18n="p3PriceLabel"></span>
          <span data-i18n="p3Price"></span>
        </div>
      </article>

    </div>
  </div>
</section>

<section id="specialized">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow" data-i18n="tariffEyebrow"></div>
      <h2 data-i18n="tariffTitle"></h2>
      <p data-i18n="tariffSub"></p>
    </div>

    <div class="table-scroll">
      <table class="tariff-table">
        <thead>
          <tr>
            <th data-i18n="tariffColService"></th>
            <th data-i18n="tariffColPrice"></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><div class="tariff-name" data-i18n="t1Name"></div><div class="tariff-desc" data-i18n="t1Desc"></div></td>
            <td class="tariff-price" data-i18n="t1Price"></td>
          </tr>
          <tr>
            <td><div class="tariff-name" data-i18n="t2Name"></div><div class="tariff-desc" data-i18n="t2Desc"></div></td>
            <td class="tariff-price" data-i18n="t2Price"></td>
          </tr>
          <tr>
            <td><div class="tariff-name" data-i18n="t3Name"></div><div class="tariff-desc" data-i18n="t3Desc"></div></td>
            <td class="tariff-price" data-i18n="t3Price"></td>
          </tr>
          <tr>
            <td><div class="tariff-name" data-i18n="t4Name"></div><div class="tariff-desc" data-i18n="t4Desc"></div></td>
            <td class="tariff-price" data-i18n="t4Price"></td>
          </tr>
          <tr>
            <td><div class="tariff-name" data-i18n="t5Name"></div><div class="tariff-desc" data-i18n="t5Desc"></div></td>
            <td class="tariff-price" data-i18n="t5Price"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<section id="industries">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow" data-i18n="industriesEyebrow"></div>
      <h2 data-i18n="industriesTitle"></h2>
    </div>
    <div class="industry-grid">
      <div class="industry-card"><h4 data-i18n="i1Title"></h4><p data-i18n="i1Desc"></p></div>
      <div class="industry-card"><h4 data-i18n="i2Title"></h4><p data-i18n="i2Desc"></p></div>
      <div class="industry-card"><h4 data-i18n="i3Title"></h4><p data-i18n="i3Desc"></p></div>
      <div class="industry-card"><h4 data-i18n="i4Title"></h4><p data-i18n="i4Desc"></p></div>
      <div class="industry-card"><h4 data-i18n="i5Title"></h4><p data-i18n="i5Desc"></p></div>
      <div class="industry-card"><h4 data-i18n="i6Title"></h4><p data-i18n="i6Desc"></p></div>
    </div>
  </div>
</section>

<section id="vision">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow" data-i18n="visionEyebrow"></div>
      <h2 data-i18n="visionTitle"></h2>
    </div>
    <div class="vision-block">
      <div class="vision-col">
        <h4 data-i18n="visionVendorsTitle"></h4>
        <p data-i18n="visionVendorsDesc"></p>
        <div class="vendor-row">
          <span class="vendor-chip">Huawei</span>
          <span class="vendor-chip">Sangfor</span>
          <span class="vendor-chip">Fortinet</span>
          <span class="vendor-chip">Thales</span>
          <span class="vendor-chip">Cisco</span>
        </div>
      </div>
      <div class="vision-col">
        <h4 data-i18n="visionWeb3Title"></h4>
        <p data-i18n="visionWeb3Desc"></p>
      </div>
    </div>
  </div>
</section>

<section class="audit-section" id="audit-form-section">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow" data-i18n="formEyebrow"></div>
      <h2 data-i18n="formTitle"></h2>
      <p data-i18n="formSub"></p>
    </div>

    <form id="audit-form" novalidate>
      <div class="form-grid">
        <div class="field">
          <label for="f-name" data-i18n="fName"></label>
          <input type="text" id="f-name" name="name" required autocomplete="name">
        </div>
        <div class="field">
          <label for="f-company" data-i18n="fCompany"></label>
          <input type="text" id="f-company" name="company" required autocomplete="organization">
        </div>
        <div class="field">
          <label for="f-email" data-i18n="fEmail"></label>
          <input type="email" id="f-email" name="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="f-phone" data-i18n="fPhone"></label>
          <input type="tel" id="f-phone" name="phone" autocomplete="tel">
          <span class="field-hint" id="phone-hint" data-i18n="phoneHint"></span>
        </div>
        <div class="field full">
          <label for="f-message" data-i18n="fMessage"></label>
          <textarea id="f-message" name="message"></textarea>
        </div>
        <div class="form-submit">
          <button type="submit" class="btn-primary" id="form-submit-btn">
            <span data-i18n="fSubmit"></span>
          </button>
        </div>
      </div>
      <div class="form-status" id="form-status" role="status" aria-live="polite"></div>
      <p class="form-note" data-i18n="formNote"></p>
    </form>

    <div class="form-success" id="form-success" hidden role="status" aria-live="polite">
      <div class="form-success-icon">✓</div>
      <p data-i18n="formSuccessBig"></p>
    </div>

  </div>
</section>

<footer>
  <div class="wrap footer-inner">
    <span data-i18n="footerLine1"></span>
    <span data-i18n="footerLine2"></span>
  </div>
</footer>

<script>
/* ============================================================
   API BASE — ЗАМЕНИТЕ на реальный адрес вашего backend на Render,

let currentLang = localStorage.getItem("qs-lang") || "ru";

function applyLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.title = T[lang].pageTitle;

  document.querySelectorAll("[data-i18n]").forEach(function(el){
    const key = el.getAttribute("data-i18n");
    if (T[lang][key] !== undefined) el.textContent = T[lang][key];
  });
  document.querySelectorAll("[data-i18n-html]").forEach(function(el){
    const key = el.getAttribute("data-i18n-html");
    if (T[lang][key] !== undefined) el.innerHTML = T[lang][key];
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(function(el){
    const key = el.getAttribute("data-i18n-placeholder");
    if (T[lang][key] !== undefined) el.setAttribute("placeholder", T[lang][key]);
  });

  document.getElementById("lang-ru").classList.toggle("active", lang === "ru");
  document.getElementById("lang-en").classList.toggle("active", lang === "en");

  localStorage.setItem("qs-lang", lang);
}

function setLang(lang){
  applyLang(lang);
}

function scrollToScan(){
  const target = document.getElementById("product-1");
  if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
  const input = document.getElementById("domain-input");
  if (input) setTimeout(function(){ input.focus(); }, 450);
}

function cleanDomain(raw){
  return raw
    .trim()
    .toLowerCase()
    .replace(/^https?:\/\//, "")
    .replace(/^www\./, "")
    .split("/")[0]
    .split("?")[0];
}

function isValidDomain(domain){
  return /^(?!-)[a-z0-9-]{1,63}(?<!-)(\.[a-z0-9-]{1,63})+$/.test(domain);
}

function setScanStatus(message, cls){
  const el = document.getElementById("scan-status");
  el.textContent = message || "";
  el.className = "scan-status" + (cls ? " " + cls : "");
}

document.getElementById("scan-form").addEventListener("submit", async function(e){
  e.preventDefault();
  const input = document.getElementById("domain-input");
  const btn = document.getElementById("scan-submit");
  const raw = input.value;

  if (!raw || !raw.trim()){
    setScanStatus(T[currentLang].scanEmptyErr, "error");
    return;
  }

  const domain = cleanDomain(raw);
  if (!isValidDomain(domain)){
    setScanStatus(T[currentLang].scanInvalidErr, "error");
    return;
  }

  btn.disabled = true;
  setScanStatus(T[currentLang].scanBusy, "busy");

  try {
    const formData = new FormData();
    formData.append("domain", domain);

    const response = await fetch(API_BASE + "/scan", {
      method: "POST",
      body: formData
    });

    if (!response.ok) throw new Error("Scan request failed with status " + response.status);

    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "QuantumSafe_Audit_" + domain + ".pdf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    setScanStatus(T[currentLang].scanSuccess, "success");
  } catch (err) {
    setScanStatus(T[currentLang].scanFailErr, "error");
  } finally {
    btn.disabled = false;
  }
});

function setFormStatus(message, cls){
  const el = document.getElementById("form-status");
  el.textContent = message || "";
  el.className = "form-status" + (cls ? " " + cls : "");
}

/* Light phone normalization for KG numbers:
   - strips spaces/dashes/parentheses
   - a leading "0" (local trunk prefix) becomes "+996"
   - a bare "996..." gets a leading "+"
   - anything already starting with "+" is left as-is
   Does not attempt full international validation — just nudges the
   common local-format cases into something callable. */
function normalizePhone(raw){
  let digits = raw.trim().replace(/[\s\-().]/g, "");
  if (!digits) return "";
  if (digits.startsWith("+")) return digits;
  if (digits.startsWith("00")) return "+" + digits.slice(2);
  if (digits.startsWith("0")) return "+996" + digits.slice(1);
  if (digits.startsWith("996")) return "+" + digits;
  if (/^[0-9]/.test(digits)) return "+996" + digits;
  return digits;
}

document.getElementById("f-phone").addEventListener("blur", function(){
  if (this.value.trim()) this.value = normalizePhone(this.value);
});

document.getElementById("audit-form").addEventListener("submit", async function(e){
  e.preventDefault();
  const btn = document.getElementById("form-submit-btn");
  const btnLabel = btn.querySelector("span");
  const form = document.getElementById("audit-form");
  const successPanel = document.getElementById("form-success");

  const payload = {
    name: document.getElementById("f-name").value.trim(),
    company: document.getElementById("f-company").value.trim(),
    email: document.getElementById("f-email").value.trim(),
    phone: normalizePhone(document.getElementById("f-phone").value.trim()),
    message: document.getElementById("f-message").value.trim(),
    lang: currentLang
  };

  if (!payload.name || !payload.company || !payload.email){
    setFormStatus(T[currentLang].formFieldsErr, "error");
    return;
  }

  btn.disabled = true;
  const originalLabel = btnLabel.textContent;
  btnLabel.textContent = T[currentLang].formSending;
  setFormStatus("", "");

  try {
    /* The Telegram Bot API token lives only on the backend (env var),
       never in this file — see /contact-request in main.py. Sending it
       from browser JS would expose it to anyone viewing page source. */
    const response = await fetch(API_BASE + "/contact-request", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!response.ok) throw new Error("Lead submission failed with status " + response.status);

    form.hidden = true;
    successPanel.hidden = false;
    successPanel.scrollIntoView({ behavior: "smooth", block: "center" });
  } catch (err) {
    setFormStatus(T[currentLang].formFailErr, "error");
    btn.disabled = false;
    btnLabel.textContent = originalLabel;
  }
});
